[package]
name = "pyosmptparser"
version = "3.0.0"
authors = ["Julian Perelli <jperelli@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
readme = "README.md"
description = "Python bindings for osmptparser, the OpenStreetMap public transport parser"
repository = "https://github.com/cualbondi/pyosmptparser"

[lib]
name = "pyosmptparser"
crate-type = ["cdylib"]

[dependencies]
# osmptparser = { path = "../osmptparser" }
# osmptparser = { git = "https://github.com/cualbondi/osmptparser", rev = "775bb442303" }
osmptparser = "3.0.0"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
num_cpus = "1.17.0"
